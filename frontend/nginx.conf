##############################################################
# Tavilo — production nginx config (runs inside frontend container)
# Cloudflare → port 80 → nginx → api:8000
##############################################################

# Upstream: FastAPI backend (service name from docker-compose)
upstream api_backend {
    server api:8000;
    keepalive 32;
}

# ── Gzip compression ──────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/webp
    image/svg+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Max body size for product image uploads
    client_max_body_size 15m;

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health / readiness probes (proxy to FastAPI) ────────
    location = /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /ready {
        proxy_pass http://api_backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── API proxy ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Allow cookies to pass through
        proxy_pass_header Set-Cookie;

        # Timeouts suitable for file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── Media / uploads proxy ───────────────────────────────
    location /media/ {
        proxy_pass http://api_backend/media/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection      "";

        # Cache product images in the browser
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Static asset caching ────────────────────────────────
    # Vite fingerprints JS/CSS so safe to cache forever
    location ~* \.(js|css|webp|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── SPA fallback — all other routes ────────────────────
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files (.env, .git, etc.) ───────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
