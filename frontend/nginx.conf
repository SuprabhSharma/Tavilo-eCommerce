##############################################################
# Tavilo — production nginx config (runs inside frontend container)
# Cloudflare (Full Strict) → HTTPS:443 → nginx → api:8000
##############################################################

# Upstream: FastAPI backend (service name from docker-compose)
upstream api_backend {
    server api:8000;
    keepalive 32;
}

# ── Gzip compression ──────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/webp
    image/svg+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject;

# ── HTTP Server (Port 80): Health checks + HTTPS redirect ─
server {
    listen 80 default_server;
    server_name tavilo.website www.tavilo.website localhost 127.0.0.1;

    # Local & probe health checks on port 80 (needed for Docker container healthcheck)
    location = /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /ready {
        proxy_pass http://api_backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://tavilo.website$request_uri;
    }
}

# ── HTTPS: www → non-www canonical redirect ───────────────
server {
    listen 443 ssl;
    server_name www.tavilo.website;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    return 301 https://tavilo.website$request_uri;
}

# ── HTTPS: Main production site ───────────────────────────
server {
    listen 443 ssl default_server;
    server_name tavilo.website;

    # ── Cloudflare Origin Certificate ───────────────────────
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # ── TLS settings ────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Max body size for product image uploads
    client_max_body_size 15m;

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Shared proxy settings ────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Health / readiness probes ────────────────────────────
    location = /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://api_backend/ready;
        access_log off;
    }

    # ── API proxy ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # ── Media / uploads proxy ────────────────────────────────
    location /media/ {
        proxy_pass http://api_backend/media/;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Static asset caching ─────────────────────────────────
    location ~* \.(js|css|webp|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
