version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@db:5432/marketplace
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn src:app --host 0.0.0.0 --port 8000 --reload --log-level info --access-log

  frontend:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: /api/v1
      VITE_PROXY_TARGET: http://api:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  frontend_node_modules:
