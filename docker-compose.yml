##############################################################
# Tavilo — Production Docker Compose
# Usage: docker compose up -d
# Secrets: populate .env.server and backend/.env.production
##############################################################

name: tavilo

# ── Shared network ─────────────────────────────────────────
networks:
  tavilo_network:
    driver: bridge
    internal: false   # allow outbound (email, etc.)
    ipam:
      config:
        - subnet: 172.30.0.0/24

# ── Named volumes ──────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  media_uploads:
    driver: local

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    networks:
      - tavilo_network
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ── No external port — only accessible inside the bridge network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────────────────
  # FastAPI backend
  # ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      tavilo_network:
        ipv4_address: 172.30.0.2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    environment:
      # Override DATABASE_URL with the correct docker-network hostname
      DATABASE_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      REDIS_URL: "redis://redis:6379/0"
      TRUSTED_PROXY_CIDRS: "172.30.0.3/32"
    volumes:
      # Persist product images across deploys
      - media_uploads:/app/uploads
    # ── No external port — nginx proxies all traffic
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ──────────────────────────────────────────────────────────
  # Redis is private to the Docker network and holds only expiring, HMAC-keyed
  # rate-limit buckets. It has no published port and no persistence volume.
  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      tavilo_network:
        ipv4_address: 172.30.0.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # React frontend (nginx reverse-proxy + static files)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      tavilo_network:
        ipv4_address: 172.30.0.3
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/tavilo.conf:ro
      - /opt/tavilo/ssl:/etc/nginx/ssl:ro
