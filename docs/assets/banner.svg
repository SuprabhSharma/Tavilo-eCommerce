<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Tavilo — multi-vendor commerce engine</title>
  <desc id="d">Animated banner: one cart splits into orders for many independent stores. Tagline: One cart. Many stores. Zero overselling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.55" stop-color="#0b1d38"/>
      <stop offset="1" stop-color="#10284b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0bb5b0"/>
      <stop offset="0.6" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <radialGradient id="orbT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0bb5b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0bb5b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p1" d="M830 190 C 900 190, 920 90, 1000 90"/>
    <path id="p2" d="M830 190 L 1000 190"/>
    <path id="p3" d="M830 190 C 900 190, 920 290, 1000 290"/>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <circle cx="160" cy="60" r="220" fill="url(#orbT)">
    <animate attributeName="r" values="200;250;200" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="340" r="240" fill="url(#orbA)">
    <animate attributeName="r" values="230;190;230" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- wordmark -->
  <text x="64" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="14" fill="url(#word)" filter="url(#glow)">TAVILO</text>
  <text x="68" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="7" fill="#8aa4c8">MULTI-VENDOR COMMERCE ENGINE</text>
  <text x="68" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#e6f1ff">One cart. Many stores. Zero overselling.</text>

  <!-- stack chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="68" y="282" width="108" height="32" rx="16" fill="#0bb5b0" fill-opacity="0.14" stroke="#0bb5b0" stroke-opacity="0.7"/>
    <text x="122" y="303" fill="#5eead4">FastAPI</text>
    <rect x="188" y="282" width="108" height="32" rx="16" fill="#0bb5b0" fill-opacity="0.14" stroke="#0bb5b0" stroke-opacity="0.7"/>
    <text x="242" y="303" fill="#5eead4">React 18</text>
    <rect x="308" y="282" width="140" height="32" rx="16" fill="#0bb5b0" fill-opacity="0.14" stroke="#0bb5b0" stroke-opacity="0.7"/>
    <text x="378" y="303" fill="#5eead4">PostgreSQL 16</text>
    <rect x="460" y="282" width="96" height="32" rx="16" fill="#f5a623" fill-opacity="0.14" stroke="#f5a623" stroke-opacity="0.7"/>
    <text x="508" y="303" fill="#ffd38a">Docker</text>
  </g>

  <!-- animated split: one cart -> many stores -->
  <g>
    <circle cx="800" cy="190" r="34" fill="#0b1d38" stroke="#5eead4" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="800" y="197" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#e6f1ff">CART</text>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8">
      <use href="#p1" stroke="#0bb5b0"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></use>
      <use href="#p2" stroke="#f5a623"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></use>
      <use href="#p3" stroke="#a78bfa"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></use>
    </g>

    <circle r="5" fill="#5eead4" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5" fill="#f5a623" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

    <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="1000" y="68" width="130" height="44" rx="12" fill="#0bb5b0" fill-opacity="0.15" stroke="#0bb5b0"/>
      <text x="1065" y="94" fill="#5eead4">STORE A</text>
      <rect x="1000" y="168" width="130" height="44" rx="12" fill="#f5a623" fill-opacity="0.15" stroke="#f5a623"/>
      <text x="1065" y="194" fill="#ffd38a">STORE B</text>
      <rect x="1000" y="268" width="130" height="44" rx="12" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/>
      <text x="1065" y="294" fill="#d4c8ff">STORE C</text>
    </g>
    <text x="1065" y="338" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8aa4c8">1 ORDER · N SUB-ORDERS</text>
  </g>

  <!-- heartbeat line -->
  <path d="M0 352 H300 l14 -18 l14 36 l14 -28 l10 10 H1200" fill="none" stroke="#0bb5b0" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="320 1200">
    <animate attributeName="stroke-dashoffset" from="1520" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
