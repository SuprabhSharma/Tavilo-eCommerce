<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">How one Tavilo checkout becomes many vendor orders</title>
  <desc id="d">A cart holding items from three stores passes through one atomic, idempotent checkout and becomes one order split into one sub-order per store, each fulfilled independently.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0d2140"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="a1" d="M268 150 C 300 150, 300 260, 340 260"/>
    <path id="a2" d="M268 250 C 300 250, 300 260, 340 260"/>
    <path id="a3" d="M268 350 C 300 350, 300 260, 340 260"/>
    <path id="b1" d="M560 260 C 620 260, 620 120, 700 120"/>
    <path id="b2" d="M560 260 H 700"/>
    <path id="b3" d="M560 260 C 620 260, 620 400, 700 400"/>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="6" fill="#e6f1ff">ONE CHECKOUT · MANY STORES</text>
    <text x="600" y="66" text-anchor="middle" font-size="13" letter-spacing="3" fill="#8aa4c8">THE CORE IDEA BEHIND TAVILO</text>

    <!-- CART -->
    <rect x="40" y="96" width="228" height="330" rx="18" fill="#0b1d38" stroke="#0bb5b0" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="154" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#e6f1ff">1 · ONE CART</text>
    <text x="154" y="144" text-anchor="middle" font-size="11" fill="#8aa4c8">server-side, per customer</text>
    <g font-size="12.5" font-weight="600">
      <rect x="58" y="162" width="192" height="40" rx="10" fill="#0bb5b0" fill-opacity="0.16" stroke="#0bb5b0"/>
      <text x="72" y="187" fill="#5eead4">Item 1 · Store A</text>
      <rect x="58" y="212" width="192" height="40" rx="10" fill="#0bb5b0" fill-opacity="0.16" stroke="#0bb5b0"/>
      <text x="72" y="237" fill="#5eead4">Item 2 · Store A</text>
      <rect x="58" y="262" width="192" height="40" rx="10" fill="#f5a623" fill-opacity="0.16" stroke="#f5a623"/>
      <text x="72" y="287" fill="#ffd38a">Item 3 · Store B</text>
      <rect x="58" y="312" width="192" height="40" rx="10" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa"/>
      <text x="72" y="337" fill="#d4c8ff">Item 4 · Store C</text>
      <rect x="58" y="362" width="192" height="40" rx="10" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa"/>
      <text x="72" y="387" fill="#d4c8ff">Item 5 · Store C</text>
    </g>

    <!-- CHECKOUT ENGINE -->
    <rect x="340" y="96" width="220" height="330" rx="18" fill="#0b1d38" stroke="#f5a623" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#e6f1ff">2 · ATOMIC CHECKOUT</text>
    <text x="450" y="144" text-anchor="middle" font-size="11" fill="#8aa4c8">POST /orders/checkout</text>
    <g font-size="12" fill="#e6f1ff" text-anchor="middle">
      <rect x="356" y="160" width="188" height="44" rx="10" fill="#f5a623" fill-opacity="0.12" stroke="#f5a623" stroke-opacity="0.6"/>
      <text x="450" y="179" font-weight="600">Idempotency-Key</text><text x="450" y="195" font-size="10.5" fill="#ffd38a">retry returns same order</text>
      <rect x="356" y="214" width="188" height="44" rx="10" fill="#f5a623" fill-opacity="0.12" stroke="#f5a623" stroke-opacity="0.6"/>
      <text x="450" y="233" font-weight="600">Guarded stock decrement</text><text x="450" y="249" font-size="10.5" fill="#ffd38a">WHERE stock ≥ qty</text>
      <rect x="356" y="268" width="188" height="44" rx="10" fill="#f5a623" fill-opacity="0.12" stroke="#f5a623" stroke-opacity="0.6"/>
      <text x="450" y="287" font-weight="600">Sorted lock order</text><text x="450" y="303" font-size="10.5" fill="#ffd38a">no deadlocks, no oversell</text>
      <rect x="356" y="322" width="188" height="44" rx="10" fill="#f5a623" fill-opacity="0.12" stroke="#f5a623" stroke-opacity="0.6"/>
      <text x="450" y="341" font-weight="600">Price + title snapshots</text><text x="450" y="357" font-size="10.5" fill="#ffd38a">history never changes</text>
      <text x="450" y="395" font-size="11.5" font-weight="700" fill="#5eead4">ALL OR NOTHING · ONE COMMIT</text>
    </g>

    <!-- SUB-ORDERS -->
    <text x="880" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#e6f1ff">3 · ONE ORDER → ONE SUB-ORDER PER STORE</text>
    <g>
      <rect x="700" y="96" width="360" height="48" rx="12" fill="#0bb5b0" fill-opacity="0.14" stroke="#0bb5b0"/>
      <text x="718" y="118" font-size="13" font-weight="700" fill="#5eead4">Sub-order · Store A</text>
      <text x="718" y="135" font-size="10.5" fill="#8aa4c8">2 items · fulfilled by Store A only</text>

      <rect x="700" y="236" width="360" height="48" rx="12" fill="#f5a623" fill-opacity="0.14" stroke="#f5a623"/>
      <text x="718" y="258" font-size="13" font-weight="700" fill="#ffd38a">Sub-order · Store B</text>
      <text x="718" y="275" font-size="10.5" fill="#8aa4c8">1 item · fulfilled by Store B only</text>

      <rect x="700" y="376" width="360" height="48" rx="12" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa"/>
      <text x="718" y="398" font-size="13" font-weight="700" fill="#d4c8ff">Sub-order · Store C</text>
      <text x="718" y="415" font-size="10.5" fill="#8aa4c8">2 items · fulfilled by Store C only</text>
    </g>

    <!-- status tracks -->
    <g font-size="10" fill="#8aa4c8" text-anchor="middle">
      <g>
        <line x1="760" y1="168" x2="1000" y2="168" stroke="#5eead4" stroke-opacity="0.35" stroke-width="2"/>
        <circle cx="760" cy="168" r="6" fill="#5eead4"/><circle cx="840" cy="168" r="6" fill="#0b1d38" stroke="#5eead4"/><circle cx="920" cy="168" r="6" fill="#0b1d38" stroke="#5eead4"/><circle cx="1000" cy="168" r="6" fill="#0b1d38" stroke="#5eead4"/>
        <circle r="5" cy="168" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="760;840;920;1000;1000" keyTimes="0;0.3;0.6;0.9;1" dur="6s" repeatCount="indefinite"/></circle>
        <text x="760" y="192">placed</text><text x="840" y="192">confirmed</text><text x="920" y="192">shipped</text><text x="1000" y="192">delivered</text>
      </g>
      <g>
        <line x1="760" y1="308" x2="1000" y2="308" stroke="#f5a623" stroke-opacity="0.35" stroke-width="2"/>
        <circle cx="760" cy="308" r="6" fill="#f5a623"/><circle cx="840" cy="308" r="6" fill="#0b1d38" stroke="#f5a623"/><circle cx="920" cy="308" r="6" fill="#0b1d38" stroke="#f5a623"/><circle cx="1000" cy="308" r="6" fill="#0b1d38" stroke="#f5a623"/>
        <circle r="5" cy="308" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="760;760;840;920;1000;1000" keyTimes="0;0.15;0.4;0.65;0.9;1" dur="6s" repeatCount="indefinite"/></circle>
        <text x="760" y="332">placed</text><text x="840" y="332">confirmed</text><text x="920" y="332">shipped</text><text x="1000" y="332">delivered</text>
      </g>
      <g>
        <line x1="760" y1="448" x2="1000" y2="448" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
        <circle cx="760" cy="448" r="6" fill="#a78bfa"/><circle cx="840" cy="448" r="6" fill="#0b1d38" stroke="#a78bfa"/><circle cx="920" cy="448" r="6" fill="#0b1d38" stroke="#a78bfa"/><circle cx="1000" cy="448" r="6" fill="#0b1d38" stroke="#a78bfa"/>
        <circle r="5" cy="448" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="760;760;760;840;920;1000" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite"/></circle>
        <text x="760" y="472">placed</text><text x="840" y="472">confirmed</text><text x="920" y="472">shipped</text><text x="1000" y="472">delivered</text>
      </g>
    </g>

    <!-- flows -->
    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6">
      <use href="#a1" stroke="#0bb5b0"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></use>
      <use href="#a2" stroke="#f5a623"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></use>
      <use href="#a3" stroke="#a78bfa"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></use>
      <use href="#b1" stroke="#0bb5b0"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></use>
      <use href="#b2" stroke="#f5a623"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></use>
      <use href="#b3" stroke="#a78bfa"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></use>
    </g>
    <g filter="url(#glow)">
      <circle r="4.5" fill="#5eead4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
      <circle r="4.5" fill="#f5a623"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
      <circle r="4.5" fill="#a78bfa"><animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
      <circle r="4.5" fill="#5eead4"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle>
      <circle r="4.5" fill="#f5a623"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
      <circle r="4.5" fill="#a78bfa"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#b3"/></animateMotion></circle>
    </g>

    <text x="600" y="500" text-anchor="middle" font-size="12.5" fill="#8aa4c8">The customer tracks <tspan fill="#5eead4" font-weight="700">one order</tspan> · each store only sees and fulfils <tspan fill="#ffd38a" font-weight="700">its own items</tspan> · cancelling restores stock</text>
  </g>
</svg>
